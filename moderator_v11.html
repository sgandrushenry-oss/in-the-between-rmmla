<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>In the Between — Moderator</title>
<style>
:root{--paper:#FAF9F7;--ink:#111;--line:#C9C5BF;--muted:#66615D;--s1:#F0D5BE;--s2:#D6B99A;--s3:#C58C74;--s4:#A76D5A;--s5:#7C4D4A;--sans:Arial,Helvetica,sans-serif;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--serif);background-color:var(--paper);background-image:radial-gradient(circle at 16% 18%,rgba(240,213,190,.18) 0 1px,transparent 2px),radial-gradient(circle at 78% 26%,rgba(214,185,154,.14) 0 1.2px,transparent 2.3px),radial-gradient(circle at 32% 72%,rgba(197,140,116,.10) 0 1.1px,transparent 2.2px),repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 6px)}
main{max-width:820px;margin:auto;padding:28px 18px 80px}.eyebrow{font:700 .72rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h1{font-weight:400;line-height:1;margin:.45rem 0 1rem;font-size:clamp(2.3rem,8vw,4.8rem)}p{line-height:1.5}.box{background:rgba(255,255,255,.86);border:1px solid var(--line);padding:1rem;margin:1rem 0}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}input{padding:.7rem;border:1px solid var(--ink);min-width:220px;flex:1}button{font:700 .74rem var(--sans);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:transparent;padding:.65rem .8rem;cursor:pointer}button.primary{background:var(--ink);color:white}.status{font: .78rem var(--sans);color:var(--muted)}.list{display:grid;gap:.75rem}.item{background:white;border:1px solid var(--line);padding:.85rem;display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:start}.item.pending{border-left:9px solid var(--s3)}.item.approved{border-left:9px solid var(--s2)}.item.hidden{border-left:9px solid var(--s5);opacity:.72}.text{font-size:1.08rem;line-height:1.35}.meta{font:.7rem var(--sans);color:var(--muted);margin-top:.35rem}.actions{display:flex;gap:.45rem;flex-wrap:wrap}.empty{color:var(--muted);font-style:italic}.pill{font:.68rem var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:.25rem .45rem;border:1px solid var(--line);display:inline-block;margin-left:.4rem}
</style>
</head>
<body><main>
<div class="eyebrow">IN THE BETWEEN · PRIVATE MODERATOR</div>
<h1>review before display</h1>
<p>New audience fragments wait here. Nothing submitted by the audience appears in the public performance until you approve it.</p>
<div class="box">
  <div class="row"><label for="key" class="eyebrow">moderation key</label><input id="key" type="password" autocomplete="off" placeholder="private key"><button class="primary" id="load">load / refresh</button></div>
  <p class="status" id="status">The key stays in this browser tab only.</p>
</div>
<div class="row" style="justify-content:space-between"><div><strong id="roomLabel"></strong><span class="pill" id="counts"></span></div><button id="refresh">refresh</button></div>
<div class="list" id="list"><p class="empty">Enter the moderation key to load submissions.</p></div>
</main>
<script>
const params=new URLSearchParams(location.search);const room=(params.get('room')||'rmmla2026').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40)||'rmmla2026';
const keyEl=document.getElementById('key'),list=document.getElementById('list'),status=document.getElementById('status'),counts=document.getElementById('counts');document.getElementById('roomLabel').textContent='room: '+room;keyEl.value=sessionStorage.getItem('inbetween_mod_key')||'';
const leads={between:'I have been between',asked:'Graduate school asked me to be',also:'But I was also',interrupted:'Something interrupted my route:',called:'Something kept calling me back:',notyet:'I do not know yet',made:'Someone made room for me by',little:'A little movement that mattered was',possible:'What would make this possible:',becoming:'I am still becoming'};
function lineFor(x){return ((leads[x.type]||'')+' '+x.text).replace(/\s+/g,' ').trim()}
async function load(){const key=keyEl.value.trim();if(!key){status.textContent='Enter the private moderation key.';return}sessionStorage.setItem('inbetween_mod_key',key);status.textContent='Loading…';try{const r=await fetch('/api/moderation?room='+encodeURIComponent(room),{headers:{'x-admin-token':key},cache:'no-store'});if(!r.ok)throw 0;const items=await r.json();render(items);status.textContent='Connected. New submissions remain private until approved.'}catch{status.textContent='Could not load. Check the key and connection.'}}
function render(items){const pending=items.filter(x=>x.hidden&&x.pending).length,approved=items.filter(x=>!x.hidden).length,hidden=items.filter(x=>x.hidden&&!x.pending).length;counts.textContent=`${pending} pending · ${approved} approved · ${hidden} hidden`;list.innerHTML='';if(!items.length){list.innerHTML='<p class="empty">No submissions yet.</p>';return}items.slice().reverse().forEach(x=>{const row=document.createElement('div');row.className='item '+(x.hidden?(x.pending?'pending':'hidden'):'approved');const left=document.createElement('div');left.innerHTML='<div class="text"></div><div class="meta"></div>';left.querySelector('.text').textContent=lineFor(x);left.querySelector('.meta').textContent=(x.hidden?(x.pending?'pending':'hidden'):'approved')+' · '+new Date(x.createdAt).toLocaleTimeString();const actions=document.createElement('div');actions.className='actions';if(x.hidden&&x.pending){const a=document.createElement('button');a.className='primary';a.textContent='approve';a.onclick=()=>moderate(x.id,false,false);const h=document.createElement('button');h.textContent='hide';h.onclick=()=>moderate(x.id,true,false);actions.append(a,h)}else if(!x.hidden){const h=document.createElement('button');h.textContent='hide';h.onclick=()=>moderate(x.id,true,false);actions.append(h)}else{const r=document.createElement('button');r.textContent='restore';r.onclick=()=>moderate(x.id,false,false);actions.append(r)}row.append(left,actions);list.appendChild(row)})}
async function moderate(id,hidden,pending){const key=keyEl.value.trim();try{const r=await fetch('/api/moderate?room='+encodeURIComponent(room),{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':key},body:JSON.stringify({id,hidden,pending})});if(!r.ok)throw 0;await load()}catch{status.textContent='Could not update that fragment.'}}
document.getElementById('load').onclick=load;document.getElementById('refresh').onclick=load;keyEl.addEventListener('keydown',e=>{if(e.key==='Enter')load()});setInterval(()=>{if(keyEl.value.trim())load()},5000);if(keyEl.value.trim())load();
</script></body></html>
