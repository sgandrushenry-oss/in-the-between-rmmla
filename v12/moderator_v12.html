<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>In the Between — V12 Moderator</title><link rel="stylesheet" href="/v12.css"></head><body><main class="page"><div class="eyebrow">PRIVATE MODERATOR · V12</div><h1>review before display.</h1><p class="lede">New audience fragments remain hidden until you approve them.</p><div class="card"><input id="key" type="password" placeholder="moderation key" style="width:min(520px,100%);padding:.7rem;border:1px solid var(--char)"><button class="btn" id="load">load / refresh</button><p class="small" id="status"></p></div><div id="list" style="display:grid;gap:.7rem;margin-top:1rem"></div></main><script>
const params=new URLSearchParams(location.search),room=(params.get('room')||'rmmla2026').replace(/[^a-zA-Z0-9_-]/g,'')||'rmmla2026',key=document.getElementById('key'),list=document.getElementById('list'),status=document.getElementById('status');key.value=sessionStorage.getItem('v12_mod')||'';async function load(){const k=key.value.trim();if(!k){status.textContent='Enter the moderation key.';return}sessionStorage.setItem('v12_mod',k);try{const r=await fetch('/api/moderation?room='+encodeURIComponent(room),{headers:{'x-admin-token':k},cache:'no-store'});if(!r.ok)throw 0;render(await r.json());status.textContent='Connected. Pending fragments stay private until approved.'}catch{status.textContent='Could not load. Check the key.'}}function render(items){list.innerHTML='';if(!items.length){list.innerHTML='<p class="small">No submissions yet.</p>';return}items.slice().reverse().forEach(x=>{const d=document.createElement('div');d.className='card';d.style.borderLeft='8px solid '+(x.hidden?(x.pending?'var(--skin3)':'var(--skin5)'):'var(--teal)');const p=document.createElement('p');p.style.margin='.1rem 0 .7rem';p.textContent=x.text;const meta=document.createElement('div');meta.className='small';meta.textContent=x.hidden?(x.pending?'pending':'hidden'):'approved';const a=document.createElement('button');a.className='btn';a.textContent=x.hidden?(x.pending?'approve':'restore'):'hide';a.onclick=()=>moderate(x.id,!x.hidden);d.append(p,meta,a);list.appendChild(d)})}async function moderate(id,hidden){try{const r=await fetch('/api/moderate?room='+encodeURIComponent(room),{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':key.value.trim()},body:JSON.stringify({id,hidden,pending:false})});if(!r.ok)throw 0;load()}catch{status.textContent='Could not update that fragment.'}}document.getElementById('load').onclick=load;setInterval(()=>{if(key.value.trim())load()},5000);if(key.value.trim())load();
</script></body></html>
