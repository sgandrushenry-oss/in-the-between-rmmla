<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>In the Between — V12 Links</title><link rel="stylesheet" href="/v12.css"></head><body><main class="page"><div class="eyebrow">V12 · LIVE TEST LINKS</div><h1>practice + testing hub.</h1><p class="lede">V12 is a separate development deployment. The working V11 conference site remains untouched while this version is tested.</p><div id="links" class="explore-grid"></div><p class="small">Keep the moderator key private. Audience testers need only the Audience, Presentation, Explore, or QR links.</p></main><script>
const base=location.origin,room='rmmla2026';const data=[['Presenter / Practice',`/presenter?room=${room}`,'Full nine-screen performance with presenter controls and notes.'],['Audience Contribute',`/audience?room=${room}`,'Fast contribution page.'],['Clean Presentation',`/presentation?room=${room}`,'Full nine-screen performance without presenter controls.'],['Explore',`/explore?room=${room}`,'Definitions, Sources, Little Movements, and About the Project.'],['Moderator',`/moderator?room=${room}`,'Private moderation page.'],['QR',`/qr?room=${room}`,'Large V12 test QR.']];const z=document.getElementById('links');data.forEach(([n,u,d],i)=>{const s=document.createElement('section');s.style.borderTopColor=['var(--skin1)','var(--skin2)','var(--skin3)','var(--skin4)','var(--skin5)','var(--graphite)'][i];s.innerHTML=`<h2>${n}</h2><p>${d}</p><p class="small" style="word-break:break-all">${base+u}</p><p><a class="btn" href="${u}" target="_blank">open</a> <button class="btn ghost" data-copy="${base+u}">copy url</button></p>`;z.appendChild(s)});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='copied'}catch{prompt('Copy URL:',b.dataset.copy)}})
</script></body></html>
