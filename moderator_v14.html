<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator — In the Between V14</title><link rel="stylesheet" href="/v13.css"></head><body><main class="mod-wrap"><div class="eyebrow">Private Moderator · V14</div><h1 class="page-title">review before display</h1><p>New audience fragments remain private until you approve them.</p><div class="card"><p><label class="small" for="key">Moderation key</label><br><input id="key" type="password" style="width:min(520px,100%);padding:.65rem;border:1px solid var(--charcoal)"> <button class="submit" id="load">Load / refresh</button></p><p class="status" id="status">The key stays in this browser session.</p></div><p class="small" id="counts"></p><div class="moderation-list" id="list"></div></main><script>
const p=new URLSearchParams(location.search),room=(p.get('room')||'rmmla2026').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40),key=document.getElementById('key'),list=document.getElementById('list'),status=document.getElementById('status'),counts=document.getElementById('counts');key.value=sessionStorage.getItem('v14_mod_key')||'';const leads={between:'I have been between',asked:'Graduate school asked me to be',also:'But I was also',interrupted:'Something interrupted my route:',called:'Something kept calling me back:',notyet:'I do not know yet',made:'Someone made room for me by',little:'A little movement that mattered was',possible:'What would make this possible:',carry:'Something that carries over is',becoming:'I am still becoming',grad_thoughts:'Graduate school brings to mind',grad_shape:'Graduate education shaped me',imagined:'Graduate students are imagined',daemon_return:'What keeps returning:',conduct_form:'What helps something take form:'};const line=x=>((leads[x.type]||'')+' '+x.text).trim();async function load(){const k=key.value.trim();if(!k){status.textContent='Enter the private moderation key.';return}sessionStorage.setItem('v14_mod_key',k);status.textContent='Loading…';try{const r=await fetch('/api/moderation?room='+encodeURIComponent(room),{headers:{'x-admin-token':k},cache:'no-store'});if(!r.ok)throw 0;const items=await r.json();render(items);status.textContent='Connected. New submissions remain private until approved.'}catch{status.textContent='Could not load. Check the key and connection.'}}function render(items){const pending=items.filter(x=>x.hidden&&x.pending).length,approved=items.filter(x=>!x.hidden).length,hidden=items.filter(x=>x.hidden&&!x.pending).length;counts.textContent=`${pending} pending · ${approved} approved · ${hidden} hidden`;list.innerHTML='';if(!items.length){list.innerHTML='<p class="small">No submissions yet.</p>';return}items.slice().reverse().forEach(x=>{const row=document.createElement('div');row.className='mod-item '+(x.hidden?(x.pending?'pending':'hidden'):'approved');const t=document.createElement('div');t.innerHTML='<div></div><div class="small"></div>';t.firstChild.textContent=line(x);t.lastChild.textContent=(x.hidden?(x.pending?'pending':'hidden'):'approved')+' · '+new Date(x.createdAt).toLocaleTimeString();const a=document.createElement('div');a.className='mod-actions';if(x.hidden&&x.pending){a.append(btn('approve',()=>moderate(x.id,false,false)),btn('hide',()=>moderate(x.id,true,false)))}else if(!x.hidden)a.append(btn('hide',()=>moderate(x.id,true,false)));else a.append(btn('restore',()=>moderate(x.id,false,false)));row.append(t,a);list.append(row)})}function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}async function moderate(id,hidden,pending){try{const r=await fetch('/api/moderate?room='+encodeURIComponent(room),{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':key.value.trim()},body:JSON.stringify({id,hidden,pending})});if(!r.ok)throw 0;await load()}catch{status.textContent='Could not update that fragment.'}}document.getElementById('load').onclick=load;key.onkeydown=e=>{if(e.key==='Enter')load()};setInterval(()=>{if(key.value.trim())load()},5000);if(key.value.trim())load();
</script></body></html>
