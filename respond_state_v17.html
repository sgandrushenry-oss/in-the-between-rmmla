<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graduate-school reflection — In the Between</title><link rel="stylesheet" href="/v17.css"></head><body><div class="response-shell"><div class="wash warm"></div><main class="response-wrap"><div class="response-card"><div class="eyebrow">Add another line to the poem</div><h1 class="page-title">Graduate school:<br>what stays with you?</h1><p>Choose <strong>one</strong> question. Your response can be a sentence, phrase, or a few words. It will enter the same moderated poem as the earlier sentence-stem contributions.</p><div class="question-choices"><button class="question-choice" data-type="grad_thoughts">1) What certain things come to mind when you think about graduate school?</button><button class="question-choice" data-type="grad_shape">2) How did your graduate education shape you?</button></div><div class="response-field"><textarea id="text" maxlength="320" placeholder="your response"></textarea><p><button class="submit" id="submit">Submit for review</button> <span class="status" id="status"></span></p></div><div class="response-next"><a class="continue-link" id="continue" href="/presentation?room=rmmla2026#thresholds">Return to presentation · slide 3 →</a></div></div></main></div><script>const q=new URLSearchParams(location.search),room=(q.get('room')||'rmmla2026').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40);document.getElementById('continue').href='/presentation?room='+encodeURIComponent(room)+'#thresholds';let type=null;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;document.getElementById('text').focus()});const status=document.getElementById('status');document.getElementById('submit').onclick=async()=>{const text=document.getElementById('text').value.replace(/\s+/g,' ').trim();if(!type||!text){status.textContent='Choose one question and add your response.';return}status.textContent='Sending…';try{const r=await fetch('/api/contributions?room='+encodeURIComponent(room),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,text})});if(!r.ok)throw 0;document.getElementById('text').value='';status.textContent='Submitted for review. Thank you.'}catch{status.textContent='Could not submit. Please try again.'}};</script></body></html>
